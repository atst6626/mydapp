<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>德道生态 DeDao Ecosystem</title>
    <style>
        /* 基础重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* 锁死视口，一屏到底 */
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden; 
            position: fixed; 
            top: 0;
            left: 0;
            /* 升级为更纯净、有质感的浅冷银灰底色 */
            background-color: #f1f5f9; 
        }

        /* 高级感核心：流体光晕 (Mesh Gradient)
           利用超大范围的 filter: blur() 把色块融化成“光”，彻底告别土气 
        */
        .bg-shape-1 {
            position: absolute;
            width: 45vw;
            height: 45vw;
            min-width: 350px;
            min-height: 350px;
            background: #818cf8; /* 莫兰迪靛蓝 */
            border-radius: 50%;
            top: -10%;
            left: -10%;
            z-index: 1;
            /* 灵魂参数：极其强烈的模糊，把色块打散成光影 */
            filter: blur(100px); 
            opacity: 0.5;
            animation: float 15s ease-in-out infinite;
        }
        
        .bg-shape-2 {
            position: absolute;
            width: 55vw;
            height: 55vw;
            min-width: 400px;
            min-height: 400px;
            background: #f472b6; /* 极光粉 */
            border-radius: 50%;
            bottom: -15%;
            right: -15%;
            z-index: 1;
            filter: blur(120px);
            opacity: 0.35;
            animation: float 18s ease-in-out infinite reverse;
        }

        .bg-shape-3 {
            position: absolute;
            width: 40vw;
            height: 40vw;
            min-width: 300px;
            min-height: 300px;
            background: #38bdf8; /* 科技天蓝 */
            border-radius: 50%;
            top: 35%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1;
            filter: blur(90px);
            opacity: 0.4;
            animation: floatPulse 12s ease-in-out infinite;
        }

        /* 增加极其缓慢的呼吸悬浮动画，动态是“昂贵感”的来源 */
        @keyframes float {
            0% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-40px) scale(1.05); }
            100% { transform: translateY(0) scale(1); }
        }
        @keyframes floatPulse {
            0% { transform: translate(-50%, 0) scale(1); }
            50% { transform: translate(-50%, -30px) scale(1.1); }
            100% { transform: translate(-50%, 0) scale(1); }
        }

        /* 保证主体内容在球体上面 */
        .main-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        /* 顶部标题区域 */
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #1e293b;
            margin-bottom: 5px;
            text-shadow: 0 0 15px rgba(255,255,255,0.8);
        }
        .header p {
            font-size: 0.9rem;
            color: #475569;
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* 核心布局容器 */
        .portal-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 92%; 
            max-width: 450px;
        }

        /* === 灵魂：浴室磨砂毛玻璃底板 === */
        .glass-card {
            width: 100%;
            background: rgba(255, 255, 255, 0);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            border-top: 1.5px solid rgba(255, 255, 255, 0.5);
            border-left: 1.5px solid rgba(255, 255, 255, 0.5);
            border-radius: 24px;
            padding: 25px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            overflow: hidden;
        }

        /* 玻璃表面的对角线高光反光 (高级感的秘密) */
        .glass-card::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(
                to bottom right, 
                rgba(255, 255, 255, 0.6) 0%, 
                rgba(255, 255, 255, 0.0) 40%, 
                rgba(255, 255, 255, 0.0) 100%
            );
            pointer-events: none;
            z-index: 1;
        }

        /* 卡片内部内容 */
        .card-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 20px;
            z-index: 2;
        }

        .icon-box {
            font-size: 2.8rem;
            margin-bottom: 8px;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.1));
        }

        .card-content h2 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 6px;
            color: #0f172a; 
        }

        .card-content p {
            font-size: 0.85rem;
            color: #334155;
            line-height: 1.5;
            padding: 0 15px;
            font-weight: 500;
        }

        /* === 悬浮实体大按钮 === */
        .solid-btn {
            width: 90%; 
            padding: 15px 0;
            border-radius: 50px;
            font-size: 1.05rem;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
            color: #ffffff;
            position: relative;
            z-index: 2;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .solid-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        /* 燃烧按钮 */
        .btn-burn {
            background: linear-gradient(135deg, #ff6a00 0%, #ee0979 100%);
        }

        /* 裂变按钮 */
        .btn-fission {
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
        }

        .arrow {
            font-size: 1.1rem;
        }

        /* 📱 小屏幕适配保底 */
        @media (max-height: 700px) {
            .header { margin-bottom: 12px; }
            .header h1 { font-size: 1.8rem; }
            .portal-container { gap: 15px; }
            .glass-card { padding: 18px 10px; }
            .icon-box { font-size: 2.2rem; margin-bottom: 5px;}
            .card-content h2 { font-size: 1.3rem; }
            .card-content p { font-size: 0.8rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; } 
            .solid-btn { padding: 12px 0; font-size: 0.95rem; }
        }
    </style>
</head>
<body>

    <div class="bg-shape-1"></div>
    <div class="bg-shape-2"></div>
    <div class="bg-shape-3"></div>

    <div class="main-wrapper">
        <div class="header">
            <h1>德道生态</h1>
            <p>DEDAO ECOSYSTEM</p>
        </div>

        <div class="portal-container">
            <div class="glass-card">
                <div class="card-content">
                    <div class="icon-box">🔥</div>
                    <h2>BABY 燃烧</h2>
                    <p>启动通缩销毁机制，赋能核心价值，共享生态红利</p>
                </div>
                <a href="./burn.html" id="btnBurn" class="solid-btn btn-burn">
                    进入燃烧系统 <span class="arrow">→</span>
                </a>
            </div>

            <div class="glass-card">
                <div class="card-content">
                    <div class="icon-box">🌐</div>
                    <h2>DAOTEN 裂变</h2>
                    <p>启动三三矩阵网络，全网公排滑落，开启被动收益</p>
                </div>
                <a href="./daoten.html" id="btnFission" class="solid-btn btn-fission">
                    进入裂变矩阵 <span class="arrow">→</span>
                </a>
            </div>
        </div>
    </div>

   <script>
        // 获取当前浏览器网址后面的参数（比如 ?ref=0x123...），如果没有参数，就等于空字符串
        const queryString = window.location.search || "";
        
        const btnBurn = document.getElementById('btnBurn');
        const btnFission = document.getElementById('btnFission');
        
        // 1. 处理燃烧按钮 (留在老页面)
        if (btnBurn) {
            btnBurn.href = "./burn.html" + queryString;
        }
        
        // 2. 处理裂变按钮 (无论有没有参数，都必须去 Netlify！)
        if (btnFission) {
            btnFission.addEventListener("click", function(event) {
                event.preventDefault(); // 阻止原本的跳转
                event.stopPropagation(); // 阻止事件冒泡
                event.stopImmediatePropagation(); // 杀死其他拦截

                // 拼装最终的 Netlify 网址，把参数带上
                var finalUrl = "https://preeminent-wisp-124051.netlify.app/" + queryString;
                
                // 强制新标签页打开
                window.location.href = finalUrl;
            }, true); 
        }
    </script>
</body>
</html>
